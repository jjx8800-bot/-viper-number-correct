<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>البحث عن أرقام الشركات | VipEr</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(92%, 700px);
      margin: 0 auto;
      padding: 50px 0 20px;
    }

    .logo {
      text-align: center;
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #9da3ad;
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .card {
      background: #181c23;
      border: 1px solid #303642;
      border-radius: 24px;
      padding: 25px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #3c4350;
      background: #0d0f14;
      color: #ffffff;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #3978ed;
    }

    input::placeholder {
      color: #6f7784;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      background: #3978ed;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      color: #aeb5c0;
      line-height: 1.7;
    }

    .result {
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      background: #11141a;
      border: 1px solid #2e3541;
    }

    .result-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.6;
    }

    .result-description {
      color: #aeb5c0;
      line-height: 1.7;
      margin: 8px 0;
    }

    .phone {
      display: block;
      font-size: 22px;
      color: #65a0ff;
      font-weight: bold;
      margin-bottom: 8px;
      direction: ltr;
      text-align: left;
    }

    .source {
      display: block;
      color: #7fa9ff;
      text-decoration: none;
      margin-top: 10px;
      word-break: break-all;
      direction: ltr;
      text-align: left;
    }

    .source:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      color: #ff9b9b;
      padding: 20px;
      line-height: 1.8;
    }

    .copyright {
      text-align: center;
      margin-top: 30px;
      padding: 20px 10px;
      color: #8f96a3;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .container {
        padding-top: 35px;
      }

      .logo {
        font-size: 55px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        font-size: 15px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">🔎</div>

    <h1>البحث عن أرقام الشركات</h1>

    <div class="subtitle">
      اكتب اسم الشركة أو المنصة للبحث عن أرقام الهواتف
      المنشورة للعامة على الإنترنت.
    </div>

    <section class="card">

      <label for="company">
        اسم الشركة أو المنصة
      </label>

      <input
        id="company"
        type="text"
        placeholder="مثال: stc"
        autocomplete="off"
      >

      <button id="searchButton">
        بحث 🔎
      </button>

      <div id="status"></div>

      <div id="results"></div>

    </section>

    <footer class="copyright">
      © 2026 VipEr — جميع الحقوق محفوظة
    </footer>

  </main>

  <script>
    const companyInput = document.getElementById("company");
    const searchButton = document.getElementById("searchButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");

    searchButton.addEventListener("click", searchCompany);

    companyInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchCompany();
      }
    });

    async function searchCompany() {

      const company = companyInput.value.trim();

      resultsBox.innerHTML = "";

      if (!company) {
        statusBox.textContent =
          "اكتب اسم الشركة أو المنصة أولاً";
        return;
      }

      searchButton.disabled = true;
      statusBox.textContent = "جاري البحث...";

      try {

        const response = await fetch("/api/search", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            company: company
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "حدث خطأ أثناء البحث"
          );
        }

        statusBox.textContent =
          `تم البحث عن: ${data.company}`;

        renderResults(data);

      } catch (error) {

        statusBox.textContent = "";

        resultsBox.innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message)}
          </div>
        `;

      } finally {

        searchButton.disabled = false;

      }
    }

    function renderResults(data) {

      const phones = data.phones || [];
      const results = data.results || [];

      if (phones.length > 0) {

        const title = document.createElement("div");

        title.className = "result";

        title.innerHTML = `
          <div class="result-title">
            📞 أرقام الهواتف التي تم العثور عليها
          </div>
        `;

        resultsBox.appendChild(title);

        phones.forEach(function(phone) {

          const div = document.createElement("div");

          div.className = "result";

          div.innerHTML = `
            <span class="phone">
              ${escapeHtml(phone)}
            </span>
          `;

          resultsBox.appendChild(div);

        });

      } else {

        const empty = document.createElement("div");

        empty.className = "empty";

        empty.innerHTML = `
          لم يتم العثور على رقم هاتف في النتائج الحالية.
          <br>
          جرّب اسم الشركة بشكل أوضح.
        `;

        resultsBox.appendChild(empty);
      }

      if (results.length > 0) {

        const title = document.createElement("div");

        title.className = "result";

        title.innerHTML = `
          <div class="result-title">
            🔗 مصادر البحث
          </div>
        `;

        resultsBox.appendChild(title);

        results.forEach(function(item) {

          const div = document.createElement("div");

          div.className = "result";

          const safeUrl = escapeHtml(item.url || "");

          div.innerHTML = `
            <div class="result-title">
              ${escapeHtml(item.title || "بدون عنوان")}
            </div>

            <div class="result-description">
              ${escapeHtml(item.description || "")}
            </div>

            <a
              class="source"
              href="${safeUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🔗 فتح المصدر
            </a>
          `;

          resultsBox.appendChild(div);

        });
      }
    }

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }
  </script>

</body>
</html>
